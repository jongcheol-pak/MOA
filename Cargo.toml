[package]
name = "file_explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # SECURITY_ATTRIBUTES 정의 — CreateFileW/CreateEventW(변경 감시)가 요구
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # OVERLAPPED·GetOverlappedResult — ReadDirectoryChangesW(변경 감시)가 요구
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # Registry는 직접 사용 안 함 — SHELLEXECUTEINFOW(hkeyClass: HKEY) 구조체 정의가 요구 (없으면 E0432)
    "Win32_System_Registry",
    # 이벤트·대기 (CreateEventW·WaitForMultipleObjects) — 변경 감시 정지 신호
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # ITEMIDLIST(PIDL) 정의 — 셸 컨텍스트 메뉴(IContextMenu)가 요구
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 경량 배포 목표(NFR-2) — 크기 최적화·심볼 제거
opt-level = "s"
lto = true
strip = true
