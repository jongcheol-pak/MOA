[package]
name = "file_explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # DwmSetWindowAttribute — 다크 타이틀바(DWMWA_USE_IMMERSIVE_DARK_MODE)
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # SECURITY_ATTRIBUTES 정의 — CreateFileW/CreateEventW(변경 감시)가 요구
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # OVERLAPPED·GetOverlappedResult — ReadDirectoryChangesW(변경 감시)가 요구
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # Registry는 직접 사용 안 함 — SHELLEXECUTEINFOW(hkeyClass: HKEY) 구조체 정의가 요구 (없으면 E0432)
    "Win32_System_Registry",
    # 이벤트·대기 (CreateEventW·WaitForMultipleObjects) — 변경 감시 정지 신호
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # ITEMIDLIST(PIDL) 정의 — 셸 컨텍스트 메뉴(IContextMenu)가 요구
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# egui 이식 PoC 전용 — optional이라 기본 빌드(cargo build)에는 포함되지 않는다
eframe = { version = "0.35", optional = true }
egui_extras = { version = "0.35", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
# PoC 바이너리 전용 feature — `cargo run --bin egui_poc --features egui-poc`
egui-poc = ["dep:eframe", "dep:egui_extras", "dep:raw-window-handle"]

[[bin]]
name = "egui_poc"
path = "src/bin/egui_poc/main.rs"
required-features = ["egui-poc"]

[profile.release]
# 경량 배포 목표(NFR-2) — 크기 최적화·심볼 제거
opt-level = "s"
lto = true
strip = true
