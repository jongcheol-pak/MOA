[package]
name = "file_explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # DwmSetWindowAttribute — 다크 타이틀바(DWMWA_USE_IMMERSIVE_DARK_MODE)
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # SECURITY_ATTRIBUTES 정의 — CreateFileW/CreateEventW(변경 감시)가 요구
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # OVERLAPPED·GetOverlappedResult — ReadDirectoryChangesW(변경 감시)가 요구
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # Registry는 직접 사용 안 함 — SHELLEXECUTEINFOW(hkeyClass: HKEY) 구조체 정의가 요구 (없으면 E0432)
    "Win32_System_Registry",
    # 이벤트·대기 (CreateEventW·WaitForMultipleObjects) — 변경 감시 정지 신호
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # ITEMIDLIST(PIDL) 정의 — 셸 컨텍스트 메뉴(IContextMenu)가 요구
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# egui UI 계층 (src/ui) — 이식 후 이 앱의 주 렌더링 경로다.
# default-features를 끄고 glow(OpenGL)만 쓴다: PoC 실측에서 wgpu가 359MB, glow가 131MB로
# 백엔드가 메모리를 2.7배 갈랐다(NFR-2). wgpu를 빌드에 포함하지 않아 exe도 함께 줄인다.
eframe = { version = "0.35", default-features = false, features = ["glow"] }
# eframe이 재수출하지 않아 직접 의존 — 창 HWND 추출(셸 컨텍스트 메뉴)에 필요
raw-window-handle = "0.6"

# 이식 중 진입점 — 현행 Win32 앱(기본 bin)과 병행 유지된다.
# 이식이 끝나면 src/main.rs로 승격하고 이 섹션을 제거한다 (part2 T7)
[[bin]]
name = "file_explorer_egui"
path = "src/bin/egui_app/main.rs"

[profile.release]
# 경량 배포 목표(NFR-2) — 크기 최적화·심볼 제거
opt-level = "s"
lto = true
strip = true
